spring.application.name=springjpatutorial
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/springjpatutorial
# spring.datasource.url=jdbc:mysql://db:3306/springjpatutorial?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true

spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update

springdoc.api-docs.path=http://localhost:8082/api-docs
springdoc.swagger-ui.path=http://localhost:8084/swagger-ui-entity.html
springdoc.swagger-ui.operationsSorter=method
